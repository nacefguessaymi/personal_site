[[publication]]
key = "yu_livecell_2026"
title = "Live-cell 3D mapping reveals the organized architecture of FG-nucleoporins within the nuclear pore complex"
authors = "Yu W., Kelich J., Yu J., Tingey M., Li Y., Junod S., Jiang Z., Hansen I., Guessaymi N., Yang W."
venue = "Nature Communications (Article in Press)"
year = "2026"
type = "Journal Article"
doi = "10.1038/s41467-026-78936-5"
url = "https://doi.org/10.1038/s41467-026-78936-5"
abstract = "Live-cell single-molecule tracking with 2D-to-3D reconstruction, cross-validated by 3D MINFLUX, maps all eleven mammalian FG-nucleoporins within individual nuclear pores. The FG barrier is stratified rather than uniform: a wall-enriched central annulus surrounds a sparse axial corridor, dynamic open/closed caps sit at both pore faces, and Nup98 bridges the zones. Passive diffusion follows the central corridor while receptor-mediated transport follows FG-rich peripheral routes, motivating the Capped Adaptable Trichoid Channel (CATCH) model."
