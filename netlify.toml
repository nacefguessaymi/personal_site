[build]
  command = "chmod +x build.sh && ./build.sh"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENABLEGIT = "true"
  GO_VERSION = "1.21"
  GIT_LFS_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "hugo server -w --port 1313"
  targetPort = 1313
  publish = "public"
